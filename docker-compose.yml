services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: knitting_stories
      POSTGRES_USER: knitting
      POSTGRES_PASSWORD: knitting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knitting -d knitting_stories"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/knitting_stories
      DATABASE_USERNAME: knitting
      DATABASE_PASSWORD: knitting
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-1234567890}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      PORT: 8080
    ports:
      - "8081:8080"

volumes:
  pgdata:
