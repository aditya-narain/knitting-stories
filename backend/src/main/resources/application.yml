spring:
  application:
    name: knitting-stories-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knitting_stories}
    username: ${DATABASE_USERNAME:knitting}
    password: ${DATABASE_PASSWORD:knitting}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Base64-encoded 256-bit secret. Override in production via env.
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rbml0dGluZy1zdG9yaWVzLWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    currency: INR

springdoc:
  swagger-ui:
    path: /swagger-ui.html
